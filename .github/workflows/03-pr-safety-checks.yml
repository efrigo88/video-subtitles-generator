---
name: PR Safety Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  description:
    name: Validate PR Description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const author = context.payload.pull_request.user.login || '';
            if (author.includes('[bot]')) {
              return;
            }
            const required = ['## Summary', '## Changes', '## Verification'];
            const missing = required.filter(section => !body.includes(section));
            if (missing.length) {
              core.setFailed('Missing required PR sections: ' + missing.join(', '));
            }
